; Project cá nhân RTOS - FreeRTOS trên ESP32 (Arduino framework: FreeRTOS có sẵn trong ESP-IDF)
; Đặng Đình Mạnh - 24119055
; Mặc định build cho ESP32-S3 DevKitC-1. ESP32 thường: chọn env "esp32dev" ở thanh trạng thái PlatformIO.

[platformio]
default_envs = esp32s3
; Thư mục project có dấu tiếng Việt ("ĐỢT 2") làm ld trên Windows lỗi "Invalid argument"
; -> build ra thư mục không dấu trong C:\Users\<tên>\.pio_build\
build_dir = ${sysenv.USERPROFILE}/.pio_build/rtos_24119055

[env]
; pioarduino 55.03.30 = Arduino-ESP32 3.3.0 (ESP-IDF 5.5, FreeRTOS SMP 2 lõi)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = direct
build_flags = -DCORE_DEBUG_LEVEL=0 -Wall
extra_scripts = post:scripts/copy_fw.py
; Lấy thư viện thẳng từ GitHub theo tag cố định (build lại năm sau vẫn ra đúng bản này)
lib_deps =
    https://github.com/adafruit/Adafruit_BusIO.git#1.17.4
    https://github.com/adafruit/Adafruit-GFX-Library.git#1.12.6
    https://github.com/adafruit/Adafruit_SSD1306.git#2.5.17

[env:esp32s3]
board = esp32-s3-devkitc-1
; Cắm cổng "COM"/"UART" (chip USB-UART) -> 0. Cắm cổng "USB" gốc của chip -> đổi thành 1.
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=0

[env:esp32dev]
board = esp32dev

; Chỉ để chạy thử trên máy tính bằng QEMU của Espressif (không có kit). QEMU không giả lập ADC
; nên Task 2 dùng tín hiệu giả (SIM_NO_ADC). Không nạp bản này lên kit thật.
[env:qemu_esp32]
board = esp32dev
build_flags = ${env.build_flags} -DSIM_NO_ADC
